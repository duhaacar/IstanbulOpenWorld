name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-android:
    name: Build Unity Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: .
          unityVersion: auto
          targetPlatform: Android
          buildMethod: CIAndroidBuilder.Build
          allowDirtyBuild: true
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: IstanbulOpenWorld-Android-APK
          path: Build/Android/*.apk
          if-no-files-found: warn
